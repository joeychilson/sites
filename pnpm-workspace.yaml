packages:
  - apps/*

catalogMode: strict
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  typescript: 7.0.2
  '@types/node': 24.19.2
  cf: 1.0.0-beta.21
  '@cloudflare/vite-plugin': 2.0.0-beta.v.4
  '@cloudflare/vitest-plugin': 1.4.7
  '@tanstack/react-start': 1.169.4
  '@tanstack/react-router': 1.170.46
  '@tanstack/markdown': 1.0.0
  '@tanstack/highlight': 1.1.0
  '@vitejs/plugin-react': 6.1.2
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@fontsource-variable/inter': 5.3.0
  yaml: 2.9.1
  zod: 4.6.7

overrides:
  vite@*: 'catalog:'
  vitest@*: 5.0.5

peerDependencyRules:
