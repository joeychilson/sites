name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CF_SEND_TELEMETRY: 'false'

jobs:
  ready:
    name: Ready
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
      - run: vp run ready

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: ready
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [joeychilson, turnscope]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          BEFORE: ${{ github.event.before }}
          APP: ${{ matrix.app }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null &&
            git diff --quiet "$BEFORE" HEAD -- "apps/$APP" package.json pnpm-lock.yaml pnpm-workspace.yaml .node-version; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.deploy == 'true'
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
      - if: steps.changes.outputs.deploy == 'true'
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          vp build
          vp run deploy --mode production --no-provision
